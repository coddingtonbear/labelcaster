<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>labelcaster</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>labelcaster</h1>
      <div class="tool-group" role="group" aria-label="Tool">
        <button id="tool-select" class="tool icon-btn active" type="button" title="Select and move objects (V)" aria-label="Select">➤</button>
        <button id="tool-text" class="tool icon-btn tool-text-glyph" type="button" title="Add text (T)" aria-label="Text">T</button>
        <button id="tool-draw" class="tool icon-btn" type="button" title="Draw freehand (D)" aria-label="Draw">✎</button>
        <button id="tool-erase" class="tool icon-btn" type="button" title="Erase — draws in white (E)" aria-label="Erase">◻</button>
      </div>
      <label class="icon-btn button-like" title="Insert image" aria-label="Insert image">🖼<input id="image-file" type="file" accept="image/*" hidden /></label>
      <button id="design-download" class="icon-btn" type="button" title="Download design as a file" aria-label="Download design">⬇</button>
      <label class="icon-btn button-like" title="Open a design file" aria-label="Open design">📂<input id="design-file" type="file" accept=".labelcaster.json,application/json" hidden /></label>
      <span class="spacer"></span>
      <span id="printer-status" class="status status-unknown">checking printer…</span>
      <div class="print-group">
        <button id="print-button" type="button" disabled>🖨 Print</button>
        <button id="print-copies-toggle" type="button" title="Number of copies" aria-label="Number of copies">▾</button>
        <div id="copies-popover" hidden>
          <label class="control">Copies
            <input id="copies-input" type="number" min="1" max="100" value="1" />
          </label>
        </div>
      </div>
    </header>

    <section id="context-row" aria-label="Tool settings">
      <div id="ctx-select" class="ctx">
        <button id="delete-selection" type="button" title="Delete selected object (Del)">🗑 Delete</button>
        <span class="ctx-hint">Click an object to select it; drag to move or resize.</span>
        <span class="spacer"></span>
        <button id="clear-canvas" class="danger" type="button" title="Remove everything from the label">Clear label</button>
      </div>
      <div id="ctx-text" class="ctx" hidden>
        <label class="control">Font
          <select id="font-family">
            <option value="system-ui">System</option>
          </select>
        </label>
        <label class="control">Size
          <input id="font-size" type="number" min="6" max="128" value="40" />
        </label>
        <span class="ctx-hint">Click the label to place text; double-click existing text to edit it.</span>
      </div>
      <div id="ctx-draw" class="ctx" hidden>
        <label class="control">Brush
          <input id="brush-width" type="range" min="1" max="16" value="4" />
        </label>
        <span id="brush-readout" class="ctx-hint">4px</span>
      </div>
    </section>

    <main>
      <div class="view-tabs" role="tablist" aria-label="Canvas view">
        <button id="view-edit" class="view-tab active" type="button" role="tab">Edit</button>
        <button id="view-preview" class="view-tab" type="button" role="tab">Preview</button>
      </div>
      <div class="canvas-scroll" id="editor-view">
        <div id="canvas-holder"><canvas id="editor"></canvas></div>
      </div>
      <div class="canvas-scroll" id="preview-view" hidden>
        <canvas id="preview"></canvas>
      </div>
      <section class="label-strip" aria-label="Label size">
        <label class="control">Length (mm)
          <input id="label-length" type="number" min="1" max="1000" step="any" value="60" />
        </label>
        <button id="fit-length" type="button" title="Trim the label so the right margin matches the left">⇤⇥ Fit</button>
        <span id="length-readout"></span>
        <span class="spacer"></span>
        <label class="control" id="tape-picker-wrap" hidden>Tape
          <select id="tape-picker"></select>
        </label>
        <span id="tape-info"></span>
      </section>
    </main>

    <footer>
      <span id="print-result"></span>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
