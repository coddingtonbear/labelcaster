<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>labelcaster</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>labelcaster</h1>
      <span id="printer-status" class="status status-unknown">checking printer…</span>
    </header>

    <section class="toolbar" aria-label="Tools">
      <div class="tool-group" role="group" aria-label="Tool">
        <button id="tool-select" class="tool active" type="button">Select</button>
        <button id="tool-text" class="tool" type="button">Text</button>
        <button id="tool-draw" class="tool" type="button">Draw</button>
        <button id="tool-erase" class="tool" type="button">Erase</button>
      </div>
      <label class="control">Brush
        <input id="brush-width" type="range" min="1" max="16" value="4" />
      </label>
      <label class="control">Font
        <select id="font-family">
          <option value="system-ui">System</option>
        </select>
      </label>
      <label class="control">Size
        <input id="font-size" type="number" min="6" max="128" value="40" />
      </label>
      <label class="control button-like">Image
        <input id="image-file" type="file" accept="image/*" hidden />
      </label>
      <button id="delete-selection" type="button">Delete</button>
      <button id="clear-canvas" type="button">Clear</button>
    </section>

    <section class="label-controls">
      <label class="control" id="tape-picker-wrap" hidden>Tape
        <select id="tape-picker"></select>
      </label>
      <span id="tape-info"></span>
      <label class="control">Length (mm)
        <input id="label-length" type="number" min="1" max="1000" step="any" value="60" />
      </label>
      <button id="fit-length" type="button" title="Trim the label so the right margin matches the left">Fit</button>
      <span id="length-readout"></span>
    </section>

    <main>
      <div class="view-tabs" role="tablist" aria-label="Canvas view">
        <button id="view-edit" class="view-tab active" type="button" role="tab">Edit</button>
        <button id="view-preview" class="view-tab" type="button" role="tab">Preview</button>
      </div>
      <div class="canvas-scroll" id="editor-view">
        <div id="canvas-holder"><canvas id="editor"></canvas></div>
      </div>
      <div class="canvas-scroll" id="preview-view" hidden>
        <canvas id="preview"></canvas>
      </div>
    </main>

    <footer>
      <button id="print-button" type="button" disabled>Print</button>
      <span id="print-result"></span>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
